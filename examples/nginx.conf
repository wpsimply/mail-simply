# Mail Simply behind nginx. Only public/ is served; src/, storage/, .env and
# config.php sit outside the document root.
server {
    listen 443 ssl;
    http2 on;
    server_name webmail.example.com;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    root /var/www/mail-simply/public;
    index index.php;

    # One attachment per upload request; keep this above
    # MAIL_SIMPLY_MAX_ATTACHMENTS.
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(index|api|frame|attachment|upload|login|sso|logout)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Installed with `composer require`: where .env and storage/ live.
        # fastcgi_param MAIL_SIMPLY_HOME /etc/mail-simply;
        fastcgi_pass unix:/run/php/mail-simply.sock;
        # Attachments stream as they are read from the mail server.
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # A brake on password guessing, on top of Dovecot's own.
    # limit_req_zone $binary_remote_addr zone=mail_simply_login:10m rate=10r/m;  (in http {})
    # location = /login.php { limit_req zone=mail_simply_login burst=5; ... }
}
