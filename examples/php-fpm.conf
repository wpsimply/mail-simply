; A dedicated PHP-FPM pool for Mail Simply, e.g. /etc/php/8.4/fpm/pool.d/mail-simply.conf
[mail-simply]
user = www-data
group = www-data
listen = /run/php/mail-simply.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Attachments are uploaded one file per request; keep these above
; MAIL_SIMPLY_MAX_ATTACHMENTS. Building a message holds its attachments in
; memory, twice over while it is encoded.
php_admin_value[upload_max_filesize] = 30M
php_admin_value[post_max_size] = 32M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

; Installed as a Composer dependency, keep .env, config.php and storage/
; outside vendor/, which every update replaces.
; env[MAIL_SIMPLY_HOME] = /etc/mail-simply

; Configuration can be passed as environment variables instead of .env.
; env[MAIL_SIMPLY_IMAP_HOST] = 127.0.0.1
; env[MAIL_SIMPLY_PANEL_URL] = https://panel.example.com
