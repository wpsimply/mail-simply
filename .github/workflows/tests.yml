name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, iconv, mbstring, openssl, sodium
          coverage: none
          tools: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: JavaScript syntax
        run: node --check public/assets/app.js

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Release archive builds
        run: |
          build/release.sh 0.0.0-ci /tmp/dist
          unzip -l /tmp/dist/mail-simply-0.0.0-ci.zip

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, iconv, intl, mbstring, openssl, sodium, curl, fileinfo
          coverage: none
          tools: none

      - name: Unit tests
        run: php tests/run.php

      # The same disposable Dovecot and Mailpit a developer runs locally.
      - name: Start the test mail server
        run: tests/dovecot/start.sh

      - name: Mail server tests
        run: php tests/run.php
        env:
          MAIL_SIMPLY_TEST_IMAP: 127.0.0.1:31143
          MAIL_SIMPLY_TEST_SMTP: 127.0.0.1:31587
          MAIL_SIMPLY_TEST_MAILPIT: http://127.0.0.1:31080

      - name: Dovecot log
        if: failure()
        run: docker logs mail-simply-dovecot
