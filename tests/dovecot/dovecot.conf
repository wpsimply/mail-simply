# A disposable Dovecot for the integration tests: one test mailbox, one
# master user, no TLS. Mirrors the production setup where it matters -- a
# master passdb that authenticates on a mailbox's behalf, special-use
# folders, a quota root, submission relaying out -- and nothing else.
# Never use any of this for real mail.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap submission
listen = *

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login
auth_username_format = %{user | lower}

default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

mail_uid = vmail
mail_gid = vmail
mail_driver = maildir
mail_home = /srv/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir

mail_plugins {
  quota = yes
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

quota "User quota" {
  storage_size = 50M
}

namespace inbox {
  inbox = yes

  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
}

passdb master {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/master-users
  master = yes
  result_success = continue
}

passdb mailboxes {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | domain}/%{user | username}
  }
}

submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_trusted = yes

service submission-login {
  inet_listener submission {
    port = 587
  }
}

log_path = /dev/stderr
